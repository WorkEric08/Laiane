<!doctype html>
<html lang="pt-BR" translate="no" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Prevent browser translation prompt -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />
    <title>LA</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- PWA: Native app feel - no browser UI behaviors -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <!-- PWA: Block browser behaviors (reload, context menu) only in standalone mode -->
    <script>
      (function () {
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;

        if (isStandalone) {
          // Block pull-to-refresh and overscroll navigation
          document.addEventListener('touchmove', function (e) {
            if (e.touches.length > 1) e.preventDefault();
          }, { passive: false });

          // Block F5 / Ctrl+R / Cmd+R reload
          document.addEventListener('keydown', function (e) {
            if (
              e.key === 'F5' ||
              (e.ctrlKey && e.key === 'r') ||
              (e.metaKey && e.key === 'r')
            ) {
              e.preventDefault();
            }
          });

          // Block native context menu (long-press on mobile)
          document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
